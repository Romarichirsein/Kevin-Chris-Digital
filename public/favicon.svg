<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kc-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="kc-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  
  <!-- Outer rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#kc-bg-grad)" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- Tech ring accent -->
  <circle cx="32" cy="32" r="24" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4 4" />
  
  <!-- 'K' vertical pillar -->
  <path d="M20 16 V48" stroke="url(#kc-glow-grad)" stroke-width="5" stroke-linecap="round" />
  
  <!-- 'K' diagonals -->
  <path d="M38 18 L24 32 L40 46" stroke="url(#kc-glow-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 'C' futuristic arc -->
  <path d="M48 24 C44 18 36 18 30 22 C26 24 23 28 23 32 C23 36 26 40 30 42 C36 46 44 46 48 40" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9" />
  
  <!-- Core spark -->
  <circle cx="32" cy="32" r="2.5" fill="#38bdf8" />
</svg>
